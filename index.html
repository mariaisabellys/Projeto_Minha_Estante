<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Estante Virtual</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>📚 Minha Estante Virtual</h1>
        <button id="btn-abrir-modal">Adicionar Livro +</button>
    </header>

    <main>
        <section class="estante-secao">
            <h2>Estou lendo</h2>
            <div id="estante-lendo" class="estante-container">
            </div>
        </section>

        <section class="estante-secao">
            <h2>Quero ler</h2>
            <div id="estante-quero-ler" class="estante-container">
            </div>
        </section>

        <section class="estante-secao">
            <h2>Lidos</h2>
            <div id="estante-lidos" class="estante-container">
            </div>
        </section>
    </main>

    <div id="modal-container" class="modal-escondido">
        <div id="modal-form">
            <form id="form-livro">
                <h3>Adicionar Novo Livro</h3>

                <label for="titulo">Título</label>
                <input type="text" id="titulo" required>

                <label for="autor">Autor</label>
                <input type="text" id="autor" required>

                <label for="total_paginas">Total de Páginas:</label>
                <input type="number" id="total_paginas" required>

                <label for="capa_url">URL da Capa:</label>
                <input type="text" id="capa_url">

                <label for="status">Status</label>
                <select id="status">
                    <option value="quero-ler">Quero Ler</option>
                    <option value="lendo">Estou Lendo</option>
                    <option value="lido">Já li</option>
                </select>

                <div class="form-botoes">
                    <button type="submit">Salvar</button>
                    <button type="button" id="btn-fechar-modal">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
